name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Download Hytale Server JAR
      run: |
        mkdir -p libs
        gh release download dependencies --pattern "HytaleServer.jar" --dir libs/
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build with Gradle
      run: ./gradlew clean build -x test
      
    - name: Get release version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Find built JAR
      id: find_jar
      run: |
        JAR_PATH=$(find build/libs -name "Grid-*.jar" ! -name "*-sources.jar" | head -1)
        echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "JAR_NAME=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
        
    - name: Upload JAR to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ steps.find_jar.outputs.JAR_PATH }}
        asset_name: ${{ steps.find_jar.outputs.JAR_NAME }}
        asset_content_type: application/java-archive
